name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use a recent npm (trusted publishing needs 11.5.1+)
        run: npm install -g npm@^11.15.0 && npm --version

      - name: Publish to npm (trusted publishing - no token)
        run: npm publish

      - name: Ask NodeBB (nbbpm) to index the new version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Refreshing nbbpm index for $NAME@$VERSION"
          for attempt in 1 2 3 4 5 6; do
            sleep 20
            curl -sS -X PUT "https://packages.nodebb.org/api/v1/plugins/$NAME" >/dev/null || true
            LATEST=$(curl -sS "https://packages.nodebb.org/api/v1/plugins/$NAME" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).payload.latest||"")}catch(e){}})') || LATEST=""
            echo "attempt $attempt: nbbpm latest = $LATEST"
            if [ "$LATEST" = "$VERSION" ]; then
              echo "nbbpm now lists $VERSION"
              break
            fi
          done
